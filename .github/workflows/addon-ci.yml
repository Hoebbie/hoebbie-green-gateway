name: Green Add-on CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.10.0
      - run: node --check hoebbie-gateway/gateway.mjs
      - run: node --test hoebbie-gateway/*.test.mjs
